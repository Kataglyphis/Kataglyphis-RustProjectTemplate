name: Rust workflow on Windows 2025
on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: pwsh

jobs:
  windows-pipeline:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message || '', '[build-win]') }}
    name: Build, test, and package (windows-2025)
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh
    env:
      BINARY: kataglyphis_cli
      WINDOWS_CONTAINER_IMAGE: ghcr.io/kataglyphis/kataglyphis_beschleuniger:winamd64
      WINDOWS_DOCKER_CPUS: '4'
      WINDOWS_DOCKER_MEMORY: 16g
      WINDOWS_PACKAGE_FEATURES: gui_windows,onnxruntime_directml
      # Provide inputs for version computation script
      REF_NAME: ${{ github.ref_name }}
      RUN_NUMBER: ${{ github.run_number }}
      MSIX_PACKAGE_NAME: Kataglyphis.RustProjectTemplate
      MSIX_PUBLISHER: CN=Kataglyphis
      MSIX_PUBLISHER_DISPLAY_NAME: Kataglyphis
      MSIX_DISPLAY_NAME: Kataglyphis Rust Project Template
      MSIX_DESCRIPTION: Rust project template with optional GUI, ONNX backends, profiling, packaging, and CI workflows.

    steps:
      #- name: Enable Git long paths
      #  run: git config --global core.longpaths true

      # Windows MAX_PATH is the whole problem here. The runner workspace is
      # D:\a\<repo>\<repo> (repo name doubled, ~75 chars), and the nested
      # submodule chain - RustProjectTemplate -> ContainerHub -> DocumANTation
      # -> md2pdfLib -> latex/{smile,awesome-beamer} - pushes
      # .git/modules/.../objects/pack/pack-*.keep past 260 characters. A
      # recursive checkout here dies with "Filename too long" and
      # "fatal: '$GIT_DIR' too big" before any build step runs. So check out
      # WITHOUT submodules, then clone the whole tree into a SHORT path where
      # the same chain fits, and build from there.
      - name: Checkout repository (no submodules; see the short-path clone below)
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          submodules: false

      # This used to be ~10 hand-written lines here. ContainerHub ships the
      # identical fix - including the SSH->token-HTTPS rewrite that .gitmodules
      # forces (it pins git@github.com: for ContainerHub and a hosted runner has
      # no SSH key) - so consume it instead of maintaining a second copy that
      # can drift from the one BeschleunigerBallett's Windows lane uses.
      - name: Clone full tree with submodules into a short path (D:\ws)
        uses: Kataglyphis/Kataglyphis-ContainerHub/.github/actions/clone-into-short-path@main
        with:
          target: /d/ws
          token: ${{ github.token }}

      - name: Compute version
        id: compute-version
        shell: bash
        run: scripts/compute-version.sh

      - name: Cleanup disk space
        uses: Kataglyphis/Kataglyphis-ContainerHub/.github/actions/cleanup-disk-space@main

      # Cleaning is not the same as having cleaned ENOUGH. The winamd64 image is
      # ~54 GB to import, and a drive measured with 59.3 GB free still failed
      # with hcsshim::ImportLayer "not enough space on the disk (0x70)" - after
      # `docker pull` had already ground away for ~40 minutes. Fail in seconds
      # instead, on the drive Docker's data-root actually lives on.
      - name: Assert enough disk for the image import
        uses: Kataglyphis/Kataglyphis-ContainerHub/.github/actions/assert-docker-disk-space@main
        with:
          required-free-gb: '70'

      - name: Login to GitHub
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: Kataglyphis
          password: ${{ secrets.GHCR_PAT }}

      - name: Pull image
        run: docker pull ${{ env.WINDOWS_CONTAINER_IMAGE }}

      # The four container steps below used to be hand-written `docker run`
      # blocks repeating --memory/--cpus/--mount/-w twelve times between them.
      # ContainerHub's action carries those defaults (D:\ws -> C:\ws, 16g) and,
      # unlike the hand-rolled version, delivers the command and its arguments
      # through environment variables rather than interpolating them into a
      # shell line - so a value containing a quote or a `$` cannot escape into
      # the host's PowerShell. `file:` + `file-args:` is the documented form for
      # "a script plus an argument vector": under -File every file-args line is
      # one literal argv element, with no PowerShell parsing of its value.
      - name: Run debug unit, integration, and fuzz tests
        uses: Kataglyphis/Kataglyphis-ContainerHub/.github/actions/run-in-windows-container@main
        with:
          image: ${{ env.WINDOWS_CONTAINER_IMAGE }}
          cpus: ${{ env.WINDOWS_DOCKER_CPUS }}
          memory: ${{ env.WINDOWS_DOCKER_MEMORY }}
          file: C:\ws\scripts\windows\Invoke-DebugTests.ps1
          extra-args: |
            --env
            CARGO_TERM_COLOR=${{ env.CARGO_TERM_COLOR }}
            --env
            CARGO_BUILD_JOBS=${{ env.WINDOWS_DOCKER_CPUS }}

      - name: Build and run all Windows app configs
        uses: Kataglyphis/Kataglyphis-ContainerHub/.github/actions/run-in-windows-container@main
        with:
          image: ${{ env.WINDOWS_CONTAINER_IMAGE }}
          cpus: ${{ env.WINDOWS_DOCKER_CPUS }}
          memory: ${{ env.WINDOWS_DOCKER_MEMORY }}
          file: C:\ws\scripts\windows\Invoke-WindowsConfigMatrix.ps1
          extra-args: |
            --env
            CARGO_TERM_COLOR=${{ env.CARGO_TERM_COLOR }}
            --env
            CARGO_BUILD_JOBS=${{ env.WINDOWS_DOCKER_CPUS }}

      # VERSION deliberately carries MSIX_VERSION (the four-component form)
      # here, as it did before: this step is the one that stamps the package.
      - name: Build, lint, and package MSIX/MSI
        uses: Kataglyphis/Kataglyphis-ContainerHub/.github/actions/run-in-windows-container@main
        with:
          image: ${{ env.WINDOWS_CONTAINER_IMAGE }}
          cpus: ${{ env.WINDOWS_DOCKER_CPUS }}
          memory: ${{ env.WINDOWS_DOCKER_MEMORY }}
          file: C:\ws\scripts\windows\Build-Windows.ps1
          file-args: |
            -SkipTests
          extra-args: |
            --env
            BINARY=${{ env.BINARY }}
            --env
            VERSION=${{ env.MSIX_VERSION }}
            --env
            CARGO_TERM_COLOR=${{ env.CARGO_TERM_COLOR }}
            --env
            CARGO_BUILD_JOBS=${{ env.WINDOWS_DOCKER_CPUS }}
            --env
            CARGO_FEATURES=${{ env.WINDOWS_PACKAGE_FEATURES }}
            --env
            MSIX_PACKAGE_NAME=${{ env.MSIX_PACKAGE_NAME }}
            --env
            MSIX_PUBLISHER=${{ env.MSIX_PUBLISHER }}
            --env
            MSIX_PUBLISHER_DISPLAY_NAME=${{ env.MSIX_PUBLISHER_DISPLAY_NAME }}
            --env
            MSIX_DISPLAY_NAME=${{ env.MSIX_DISPLAY_NAME }}
            --env
            MSIX_DESCRIPTION=${{ env.MSIX_DESCRIPTION }}
            --env
            MSIX_VERSION=${{ env.MSIX_VERSION }}

      - name: Prepare archive variables
        id: vars
        run: |
          # Use version computed by shared script
          $ver = "$env:VERSION"
          $archive = "$env:BINARY-$ver-windows-2025-x64.zip"
          echo "archive_name=$archive" >> $env:GITHUB_OUTPUT
          echo "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Create archive
        uses: Kataglyphis/Kataglyphis-ContainerHub/.github/actions/run-in-windows-container@main
        with:
          image: ${{ env.WINDOWS_CONTAINER_IMAGE }}
          cpus: ${{ env.WINDOWS_DOCKER_CPUS }}
          memory: ${{ env.WINDOWS_DOCKER_MEMORY }}
          file: C:\ws\ExternalLib\Kataglyphis-ContainerHub\windows\scripts\rust\New-Archive.ps1
          extra-args: |
            --env
            BINARY=${{ env.BINARY }}
            --env
            VERSION=${{ steps.vars.outputs.version }}
            --env
            PLATFORM=windows-2025
            --env
            ARCH=x64
            --env
            CARGO_BUILD_JOBS=${{ env.WINDOWS_DOCKER_CPUS }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ env.BINARY }}-${{ steps.vars.outputs.version }}-windows-2025-x64
          path: D:/ws/dist/${{ steps.vars.outputs.archive_name }}

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ env.MSIX_PACKAGE_NAME }}-${{ steps.vars.outputs.version }}-x64-msix
          path: D:/ws/dist/msix/*.msix

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ env.BINARY }}-${{ steps.vars.outputs.version }}-x64-msi
          path: D:/ws/dist/msi/*.msi


