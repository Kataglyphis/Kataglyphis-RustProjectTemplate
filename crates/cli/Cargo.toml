[package]
name = "kataglyphis_cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
oxidant = { path = "../../" }
kataglyphis_gui = { path = "../gui", optional = true }
clap = { version = "4", features = ["derive"] }
log = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread", "time"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1", default-features = false, features = ["macros", "rt", "time", "sync"] }

[features]
default = []
gui_windows = ["kataglyphis_gui/gui_windows", "oxidant/gui_windows"]
gui_unix = ["kataglyphis_gui/gui_unix", "oxidant/gui_unix"]
onnx_tract = ["oxidant/onnx_tract"]
onnxruntime_directml = ["oxidant/onnxruntime_directml"]
onnxruntime_cuda = ["oxidant/onnxruntime_cuda"]
burn_demos = ["oxidant/burn_demos"]

[[bin]]
name = "kataglyphis_cli"
path = "src/main.rs"
